; vdog firmware — Stage 0 (package 0.2) minimal qualified PlatformIO project.
;
; Two environments only (docs/plans/0.2-toolchain-qualification.md §4.1):
;   vdog_xiao_sense_proto — cross-build for the Seeed XIAO ESP32S3 Sense
;                           target (ESP-IDF C++, BUILD evidence).
;   native                — host test environment for the portable core
;                           module in core/ (HOST evidence, `pio test` only).
;
; Device operations (upload/monitor/erase/OTA/eFuse) are not authorized at
; package 0.2. No runtime camera/SD/network/radio code exists yet.

[platformio]
name = vdog-firmware
description = vdog dog-camera firmware for Seeed XIAO ESP32S3 Sense

[env:vdog_xiao_sense_proto]
platform = platformio/espressif32@8.0.0
board = seeed_xiao_esp32s3
framework = espidf
monitor_speed = 115200
; Custom 8MB two-slot OTA table (offsets/sizes documented in the CSV header
; and docs/toolchain.md). Matches CONFIG_PARTITION_TABLE_CUSTOM_FILENAME.
board_build.partitions = partitions/vdog_8mb_two_ota.csv
; PR-review F1: the platform declares its packages by RANGE (and the
; toolchains by default 14.2.0+20260121 + optional 15.2.0+20251204).
; Pin every package this environment resolves to its EXACT qualified
; version so a cold cache reproduces the same toolchain (tool-ninja is
; the one host-resolved exception — see its inline note). The 15.2.0
; toolchains are the platform's declared optional variant that resolves
; for ESP-IDF v6.1.0; pinning prevents silent substitution by the 14.2.0
; default. All versions verified via `pio pkg list` + an empty
; PLATFORMIO_CORE_DIR run (docs/toolchain.md §2/§7).
platform_packages =
    platformio/framework-espidf@4.60100.0
    platformio/toolchain-xtensa-esp-elf@15.2.0+20251204
    platformio/toolchain-riscv32-esp@15.2.0+20251204
    platformio/toolchain-esp32ulp@1.23800.240113
    platformio/tool-cmake@3.30.2
    ; Stage 0.9 live-CI fix (2026-11-21): the PlatformIO registry publishes
    ; no linux_x86_64 build of tool-ninja above 1.7.1 (1.13.2 is darwin
    ; only), so ninja is the ONE host-resolved package: darwin -> 1.13.2
    ; (the 0.2-qualified version), linux_x86_64 CI -> 1.7.1. All other
    ; packages remain exactly pinned (docs/toolchain.md §2/§7).
    platformio/tool-ninja@>=1.7.1,<2
    platformio/tool-esptool@2.50400.0
    platformio/tool-esp-rom-elfs@0.0.1+20241011
    espressif/tool-xtensa-esp-elf-gdb@12.1.0+20221002
    espressif/tool-riscv32-esp-elf-gdb@12.1.0+20221002
    ; Review round 3 (N1): SCons driver used by the espidf builder; exact pin
    ; verified against an empty-cache install line (docs/toolchain.md §2/§7).
    platformio/tool-scons@4.41101.0
; Stage 0.9 packet A: emits gitignored firmware/.vdog-build-metadata.json
; (vdog-build-metadata-v1) after every successful normal build and regenerates
; firmware/build_gen/vdog_build_id.h before compilation. Hard-fails on invalid
; VDOG_SOURCE_SHA/VDOG_BUILD_ID. Proto environment ONLY — never add to native.
; The pre-script redirects `pio test`/`__test` builds of this environment to
; .pio/build/vdog_xiao_sense_proto_test so they can never relink the release
; images in the normal build directory (master plan 0.9.3 / CI-T03).
extra_scripts =
    pre:scripts/test_build_isolation.py
    post:scripts/gen_build_meta.py

[env:native]
; PR-review F1: pin the native platform package itself (registry
; platformio/native; verified owner/version via registry API + pio pkg
; list) and its SCons tool, so host tests are version-locked too.
platform = platformio/native@1.2.1
build_flags =
    -std=gnu11
    -Wall
    -Wextra
platform_packages =
    platformio/tool-scons@4.41101.0
; The portable pure-C core module is consumed as a local library folder here;
; the ESP-IDF environment consumes the same sources as an IDF component via
; the components/vdog_core wrapper. Keep both paths pointed at core/.
; Unity is pinned exactly (HOST reproducibility; the ESP-IDF side is locked
; via dependencies.lock) — see docs/toolchain.md §2.
lib_deps =
    ./core
    throwtheswitch/Unity@2.6.1
